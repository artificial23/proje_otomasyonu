services:
  web:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      KULUCKA_ZAMANLAYICI: harici
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "worker.py"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    depends_on:
      - web
    restart: unless-stopped
